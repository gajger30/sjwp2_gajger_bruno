<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objekt semafor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .kontejner {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 340px;
        }

        .kuciste-semafora {
            background-color: #222;
            width: 90px;
            padding: 15px;
            border-radius: 15px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .svjetlo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #444;
            margin: 0 auto;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .aktivno-crveno {
            background-color: #ff3b30;
            box-shadow: 0 0 15px #ff3b30;
        }

        .aktivno-zuto {
            background-color: #ffcc00;
            box-shadow: 0 0 15px #ffcc00;
        }

        .aktivno-zeleno {
            background-color: #34c759;
            box-shadow: 0 0 15px #34c759;
        }

        .gumbi {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 14px;
            font-size: 0.95rem;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #btnUkljuci {
            background-color: #28a745;
        }

        #btnUkljuci:hover {
            background-color: #218838;
        }

        #btnIskljuci {
            background-color: #dc3545;
        }

        #btnIskljuci:hover {
            background-color: #c82333;
        }

        #prikazStanja {
            background-color: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
            min-height: 40px;
        }

        #porukaUpozorenja {
            color: #dc3545;
            font-size: 0.9rem;
            min-height: 20px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="kontejner">
        <h2>Semafor</h2>


        <div class="kuciste-semafora">
            <div id="svjetloCrveno" class="svjetlo"></div>
            <div id="svjetloZuto" class="svjetlo"></div>
            <div id="svjetloZeleno" class="svjetlo"></div>
        </div>


        <div class="gumbi">
            <button id="btnUkljuci">Uključi</button>
            <button id="btnIskljuci">Isključi</button>
        </div>


        <div class="gumbi">
            <button id="btnCrveno">Crveno</button>
            <button id="btnZuto">Žuto</button>
            <button id="btnZeleno">Zeleno</button>
        </div>


        <div id="prikazStanja"></div>
        <div id="porukaUpozorenja"></div>
    </div>

    <script>
        const elementStanje = document.getElementById('prikazStanja');
        const elementUpozorenje = document.getElementById('porukaUpozorenja');

        const svjetloCrveno = document.getElementById('svjetloCrveno');
        const svjetloZuto = document.getElementById('svjetloZuto');
        const svjetloZeleno = document.getElementById('svjetloZeleno');


        const semafor = {
            boja: 'crvena',
            trajanje: 30,
            ukljucen: false,

            promijeniBoju(novaBoja) {

                if (!this.ukljucen) {
                    elementUpozorenje.textContent = 'Semafor je isključen! Prvo ga uključi.';
                    return;
                }

                elementUpozorenje.textContent = '';
                this.boja = novaBoja;


                if (novaBoja === 'crvena') this.trajanje = 30;
                else if (novaBoja === 'žuta') this.trajanje = 5;
                else if (novaBoja === 'zelena') this.trajanje = 25;

                this.prikaziStanje();
            },

            ukljuci() {
                this.ukljucen = true;
                elementUpozorenje.textContent = '';
                this.prikaziStanje();
            },

            iskljuci() {
                this.ukljucen = false;
                elementUpozorenje.textContent = '';
                this.prikaziStanje();
            },

            prikaziStanje() {

                svjetloCrveno.className = 'svjetlo';
                svjetloZuto.className = 'svjetlo';
                svjetloZeleno.className = 'svjetlo';

                if (!this.ukljucen) {
                    elementStanje.textContent = 'Status: ISKLJUČEN';
                    return;
                }


                if (this.boja === 'crvena') svjetloCrveno.classList.add('aktivno-crveno');
                else if (this.boja === 'žuta') svjetloZuto.classList.add('aktivno-zuto');
                else if (this.boja === 'zelena') svjetloZeleno.classList.add('aktivno-zeleno');


                elementStanje.textContent = `Status: UKLJUČEN | Boja: ${this.boja.toUpperCase()} | Trajanje: ${this.trajanje}s`;
            }
        };


        document.getElementById('btnUkljuci').addEventListener('click', () => semafor.ukljuci());
        document.getElementById('btnIskljuci').addEventListener('click', () => semafor.iskljuci());

        document.getElementById('btnCrveno').addEventListener('click', () => semafor.promijeniBoju('crvena'));
        document.getElementById('btnZuto').addEventListener('click', () => semafor.promijeniBoju('žuta'));
        document.getElementById('btnZeleno').addEventListener('click', () => semafor.promijeniBoju('zelena'));


        semafor.prikaziStanje();
    </script>

</body>

</html>
