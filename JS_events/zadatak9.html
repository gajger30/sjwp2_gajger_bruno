<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 9 – Fluidno upravljanje igračem</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #131b2e 0%, #090d16 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }
        .header {
            text-align: center;
            margin-bottom: 18px;
        }
        .header h1 {
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        .header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 720px;
            max-width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 14px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .koordinate {
            font-family: 'Consolas', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            min-width: 155px;
        }
        .kontrole {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .boje {
            display: flex;
            gap: 7px;
        }
        .boja-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .boja-btn:hover {
            transform: scale(1.18);
        }
        .boja-btn.aktivna {
            border-color: #ffffff;
            transform: scale(1.15);
        }
        .brzina-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        input[type="range"] {
            accent-color: #38bdf8;
            cursor: pointer;
            width: 90px;
        }
        #btnReset {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        #btnReset:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.45);
        }
        #btnReset:active {
            transform: translateY(0);
        }

        /* Ograničeni prostor (arena) */
        #arena {
            position: relative;
            width: 720px;
            height: 440px;
            max-width: 100%;
            background-color: #0b1120;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
            background-size: 30px 30px;
            border: 2px solid #1e293b;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(2, 6, 23, 0.9);
            overflow: hidden;
        }

        /* Obojeni kvadrat igrača */
        #igracElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        /* Suptilni unutarnji odsjaj kvadrata */
        #igracElement::after {
            content: '';
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.35);
        }

        .tipke-info {
            margin-top: 14px;
            display: flex;
            gap: 18px;
            font-size: 0.85rem;
            color: #64748b;
        }
        kbd {
            background: #1e293b;
            color: #e2e8f0;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Upravljanje objektom tipkovnicom</h1>
        <p>Fluidno 60 FPS kretanje s detekcijom rubova prostora</p>
    </div>

    <div class="hud">
        <div class="koordinate" id="prikazKoordinata">X: 338 | Y: 198</div>

        <div class="kontrole">
            <div class="boje" title="Promijeni boju igrača">
                <button class="boja-btn aktivna" style="background:#00f5d4" data-boja="#00f5d4"></button>
                <button class="boja-btn" style="background:#38bdf8" data-boja="#38bdf8"></button>
                <button class="boja-btn" style="background:#a855f7" data-boja="#a855f7"></button>
                <button class="boja-btn" style="background:#f43f5e" data-boja="#f43f5e"></button>
                <button class="boja-btn" style="background:#facc15" data-boja="#facc15"></button>
            </div>

            <div class="brzina-wrap">
                <span>Brzina:</span>
                <input type="range" id="sliderBrzina" min="2" max="14" value="6">
                <span id="vrijednostBrzine">6</span>
            </div>

            <button id="btnReset">Resetiraj (R)</button>
        </div>
    </div>

    <div id="arena">
        <div id="igracElement"></div>
    </div>

    <div class="tipke-info">
        <span>Kretanje: <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ili <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span>
        <span>Reset: <kbd>R</kbd></span>
    </div>

    <script>
        const arena = document.getElementById('arena');
        const igracEl = document.getElementById('igracElement');
        const prikazKoordinata = document.getElementById('prikazKoordinata');
        const sliderBrzina = document.getElementById('sliderBrzina');
        const vrijednostBrzine = document.getElementById('vrijednostBrzine');

        const VELICINA_IGRACA = 44;

        // Izrada objekta Igrac sa svim traženim svojstvima i metodama
        const Igrac = {
            x: 0,
            y: 0,
            brzina: 6,
            boja: '#00f5d4',

            // Pomoćne metode za izračun maksimalnih granica prostora
            maxX() {
                return arena.clientWidth - VELICINA_IGRACA;
            },
            maxY() {
                return arena.clientHeight - VELICINA_IGRACA;
            },

            // Metoda za pomicanje ulijevo (uz sprječavanje izlaska iz prostora)
            pomakniLijevo(faktor = 1) {
                this.x = Math.max(0, this.x - this.brzina * faktor);
                this.azurirajPrikaz();
            },

            // Metoda za pomicanje udesno
            pomakniDesno(faktor = 1) {
                this.x = Math.min(this.maxX(), this.x + this.brzina * faktor);
                this.azurirajPrikaz();
            },

            // Metoda za pomicanje gore
            pomakniGore(faktor = 1) {
                this.y = Math.max(0, this.y - this.brzina * faktor);
                this.azurirajPrikaz();
            },

            // Metoda za pomicanje dolje
            pomakniDolje(faktor = 1) {
                this.y = Math.min(this.maxY(), this.y + this.brzina * faktor);
                this.azurirajPrikaz();
            },

            // Metoda za resetiranje pozicije u centar prostora
            resetiraj() {
                this.x = Math.round(this.maxX() / 2);
                this.y = Math.round(this.maxY() / 2);
                this.azurirajPrikaz();
            },

            // Renderiranje pozicije i stila na ekranu (GPU-ubrzani transform)
            azurirajPrikaz() {
                igracEl.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
                igracEl.style.backgroundColor = this.boja;
                igracEl.style.boxShadow = `0 0 20px ${this.boja}88, inset 0 0 8px rgba(255,255,255,0.4)`;
                prikazKoordinata.textContent = `X: ${Math.round(this.x)} | Y: ${Math.round(this.y)}`;
            }
        };

        // Praćenje trenutno pritisnutih tipki za savršeno glatko kretanje bez zastajkivanja
        const pritisnuteTipke = {};

        // 2. Korištenje keydown i event.key (podržava Strelice i WASD)
        document.addEventListener('keydown', (event) => {
            const tipka = event.key.toLowerCase();

            // Sprječava skrolanje stranice strelicama
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(tipka)) {
                event.preventDefault();
            }

            pritisnuteTipke[tipka] = true;

            // Brzi reset na tipku R
            if (tipka === 'r') {
                Igrac.resetiraj();
            }
        });

        document.addEventListener('keyup', (event) => {
            const tipka = event.key.toLowerCase();
            pritisnuteTipke[tipka] = false;
        });

        // Ako korisnik prebaci prozor (Alt+Tab), očisti pritisnute tipke da igrač ne "odleti" sam
        window.addEventListener('blur', () => {
            for (const kljuc in pritisnuteTipke) {
                pritisnuteTipke[kljuc] = false;
            }
        });

        // Glavna 60+ FPS petlja za fluidno kretanje
        function animacijskaPetlja() {
            const lijevo = pritisnuteTipke['arrowleft'] || pritisnuteTipke['a'];
            const desno  = pritisnuteTipke['arrowright'] || pritisnuteTipke['d'];
            const gore   = pritisnuteTipke['arrowup'] || pritisnuteTipke['w'];
            const dolje  = pritisnuteTipke['arrowdown'] || pritisnuteTipke['s'];

            // Normalizacija brzine kod dijagonalnog kretanja (da dijagonalno ne ide 1.41x brže)
            const vodoravno = (lijevo ? -1 : 0) + (desno ? 1 : 0);
            const okomito   = (gore ? -1 : 0) + (dolje ? 1 : 0);
            const faktor = (vodoravno !== 0 && okomito !== 0) ? Math.SQRT1_2 : 1;

            if (lijevo) Igrac.pomakniLijevo(faktor);
            if (desno)  Igrac.pomakniDesno(faktor);
            if (gore)   Igrac.pomakniGore(faktor);
            if (dolje)  Igrac.pomakniDolje(faktor);

            requestAnimationFrame(animacijskaPetlja);
        }

        // Dodatne kontrole sučelja (Reset gumb, odabir boje, slider brzine)
        document.getElementById('btnReset').addEventListener('click', () => {
            Igrac.resetiraj();
        });

        document.querySelectorAll('.boja-btn').forEach((gumb) => {
            gumb.addEventListener('click', () => {
                document.querySelectorAll('.boja-btn').forEach(b => b.classList.remove('aktivna'));
                gumb.classList.add('aktivna');
                Igrac.boja = gumb.dataset.boja;
                Igrac.azurirajPrikaz();
            });
        });

        sliderBrzina.addEventListener('input', (event) => {
            Igrac.brzina = Number(event.target.value);
            vrijednostBrzine.textContent = Igrac.brzina;
        });

        // Početno pozicioniranje u centar i pokretanje petlje
        Igrac.resetiraj();
        requestAnimationFrame(animacijskaPetlja);
    </script>

</body>
</html>
